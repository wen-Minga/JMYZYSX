    <script>
      (() => {
        const replacements = {
          '/project-film-hills.jpg': '/assets/project-film-hills.webp',
          '/project-radio.jpg': '/assets/project-radio.webp',
          '/project-theatre.jpg': '/assets/project-theatre.webp',
          '/activity-01.jpg': '/assets/activity-01.webp',
          '/activity-02.jpg': '/assets/activity-02.webp',
          '/activity-03.jpg': '/assets/activity-03.webp',
          '/activity-04.jpg': '/assets/activity-04.webp',
          '/youth-01.jpg': '/assets/youth-01.webp',
          '/youth-02.jpg': '/assets/youth-02.webp',
          '/youth-03.jpg': '/assets/youth-03.webp',
          '/youth-04.jpg': '/assets/youth-04.webp'
        };
        const resolve = (value) => replacements[value] || value;
        const setAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if (this instanceof HTMLImageElement && name === 'src') value = resolve(String(value));
          return setAttribute.call(this, name, value);
        };
        const src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
        if (src?.set) Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true,
          enumerable: src.enumerable,
          get: src.get,
          set(value) { src.set.call(this, resolve(String(value))); }
        });
      })();
    </script>
